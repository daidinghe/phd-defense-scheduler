<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organizer View – PhD Defense</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#20242c;--muted:#667085;--border:#dfe3ea;--accent:#315efb;--good:#dff4e8;--best:#bde8ce}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1100px;margin:40px auto;padding:0 20px 50px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px}
h1{margin-top:0}
button{border:0;border-radius:10px;padding:11px 17px;background:var(--accent);color:white;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:18px}
th,td{padding:10px;border-bottom:1px solid var(--border);text-align:center}
th:first-child,td:first-child{text-align:left}
.good{background:var(--good)}
.best{background:var(--best);font-weight:700}
.muted{color:var(--muted)}
details{margin-top:20px}
pre{white-space:pre-wrap;background:#f7f8fa;padding:14px;border-radius:10px}

.person-card{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:12px 0}
.person-card h3{margin:0 0 8px;font-size:17px}
.person-card ul{margin:0;padding-left:18px}
.person-card li{margin:4px 0}
</style>

</head>
<body>
<div class="wrap">
<div class="card">
<h1>Organizer View</h1>
<p class="muted">This page summarizes all submitted availabilities. Slots available to all participants are highlighted.</p>
<button onclick="loadData()">Refresh</button>
<div id="summary"></div>
<details open>
  <summary><strong>Names and selected availability</strong></summary>
  <div id="details"></div>
</details>
</div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxFhH_qqr7U3bjMmWggKlc6a-k9iPIgeAcvGHXt4q94WASXa_Gs4fWQAUX1nkdymGjh/exec";

function fmt(date){
  const d=new Date(date+'T12:00:00');
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
}

async function loadData(){
  const s=document.getElementById('summary');
  if(API_URL.includes('PASTE_YOUR')){ s.innerHTML='<p>Please connect this page to the Apps Script backend first.</p>'; return; }

  const r=await fetch(API_URL+'?action=list');
  const raw=await r.text();
  let data;
  try{
    data=JSON.parse(raw);
  }catch(_){
    const looksHtml=/^\s*</.test(raw);
    s.innerHTML='<p>Could not load data. '+(looksHtml
      ? 'The Apps Script URL returned an HTML/Google page instead of JSON. Check that the Web App is deployed for <strong>Anyone</strong> and that this page uses the current deployment URL.'
      : 'The server returned an invalid response.')+'</p>';
    return;
  }
  if(!data.ok){ s.innerHTML='<p>Could not load data.</p>'; return; }

  const people=data.responses||[];
  const total=people.length;
  const allDates=[];
  const startDate=new Date('2026-12-01T12:00:00');
  const endDate=new Date('2027-01-31T12:00:00');
  const ex1=new Date('2026-12-21T00:00:00');
  const ex2=new Date('2027-01-03T23:59:59');

  for(let d=new Date(startDate); d<=endDate; d.setDate(d.getDate()+1)){
    const day=d.getDay();
    if(day===0 || day===6) continue;
    if(d>=ex1 && d<=ex2) continue;
    allDates.push(d.toISOString().slice(0,10));
  }

  let html=`<p><strong>${total}</strong> participant(s) submitted.</p>`;
  html+='<table><thead><tr><th>Date</th><th>Time</th><th>Available</th><th>Names</th></tr></thead><tbody>';

  for(const d of allDates){
    for(const period of ['Morning','Afternoon']){
      const names=[];
      for(const p of people){
        if((p.slots||[]).includes(d+'|'+period)) names.push(escapeHtml(p.name));
      }
      const count=names.length;
      const cls = total>0 && count===total ? 'best' : (count>0 ? 'good' : '');

      html+=`<tr class="${cls}">
        <td>${fmt(d)}</td>
        <td><strong>${period}</strong></td>
        <td>${count}/${total}</td>
        <td style="text-align:left">${names.length ? names.join(', ') : '<span class="muted">—</span>'}</td>
      </tr>`;
    }
  }

  html+='</tbody></table>';
  s.innerHTML=html;

  let det='';
  for(const p of people){
    const grouped={};
    for(const slot of (p.slots||[])){
      const parts=slot.split('|');
      const date=parts[0];
      const period=parts[1];
      if(!grouped[date]) grouped[date]=[];
      grouped[date].push(period);
    }

    const lines=Object.keys(grouped).sort().map(d=>{
      return `<li><strong>${fmt(d)}</strong>: ${grouped[d].map(escapeHtml).join(' / ')}</li>`;
    });

    det+=`<div class="person-card">
      <h3>${escapeHtml(p.name)}</h3>
      ${lines.length ? '<ul>'+lines.join('')+'</ul>' : '<p class="muted">No availability selected</p>'}
    </div>`;
  }
  document.getElementById('details').innerHTML=det;
}
function escapeHtml(x){
  return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
loadData();
</script>
</body>
</html>
