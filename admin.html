<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organizer View – PhD Defense</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#20242c;--muted:#667085;--border:#dfe3ea;--accent:#315efb;--good:#dff4e8;--best:#bde8ce}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1100px;margin:40px auto;padding:0 20px 50px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px}
h1{margin-top:0}
button{border:0;border-radius:10px;padding:11px 17px;background:var(--accent);color:white;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:18px}
th,td{padding:10px;border-bottom:1px solid var(--border);text-align:center}
th:first-child,td:first-child{text-align:left}
.good{background:var(--good)}
.best{background:var(--best);font-weight:700}
.muted{color:var(--muted)}
details{margin-top:20px}
pre{white-space:pre-wrap;background:#f7f8fa;padding:14px;border-radius:10px}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>Organizer View</h1>
<p class="muted">This page summarizes all submitted availabilities. Slots available to all participants are highlighted.</p>
<button onclick="loadData()">Refresh</button>
<div id="summary"></div>
<details>
  <summary>Participant details</summary>
  <div id="details"></div>
</details>
</div>
</div>

<script>
const API_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

function fmt(date){
  const d=new Date(date+'T12:00:00');
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
}

async function loadData(){
  const s=document.getElementById('summary');
  if(API_URL.includes('PASTE_YOUR')){ s.innerHTML='<p>Please connect this page to the Apps Script backend first.</p>'; return; }

  const r=await fetch(API_URL+'?action=list');
  const data=await r.json();
  if(!data.ok){ s.innerHTML='<p>Could not load data.</p>'; return; }

  const people=data.responses||[];
  const total=people.length;
  const counts={};
  for(const p of people){
    for(const slot of p.slots||[]) counts[slot]=(counts[slot]||0)+1;
  }

  const keys=Object.keys(counts).sort();
  let html=`<p><strong>${total}</strong> participant(s) submitted.</p>`;
  html+='<table><thead><tr><th>Date</th><th>Morning</th><th>Afternoon</th></tr></thead><tbody>';

  const dates=[...new Set(keys.map(k=>k.split('|')[0]))];
  for(const d of dates){
    const m=counts[d+'|Morning']||0;
    const a=counts[d+'|Afternoon']||0;
    const cm = total>0 && m===total ? 'best' : (m>0?'good':'');
    const ca = total>0 && a===total ? 'best' : (a>0?'good':'');
    html+=`<tr><td>${fmt(d)}</td><td class="${cm}">${m}/${total}</td><td class="${ca}">${a}/${total}</td></tr>`;
  }
  html+='</tbody></table>';
  s.innerHTML=html;

  let det='<table><thead><tr><th>Name</th><th>Selected slots</th></tr></thead><tbody>';
  for(const p of people){
    det+=`<tr><td>${escapeHtml(p.name)}</td><td style="text-align:left">${(p.slots||[]).map(escapeHtml).join('<br>')}</td></tr>`;
  }
  det+='</tbody></table>';
  document.getElementById('details').innerHTML=det;
}
function escapeHtml(x){
  return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
loadData();
</script>
</body>
</html>
